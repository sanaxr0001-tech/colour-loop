[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colour-loop"
version = "0.2.0"
description = "A tiny self-driving colour lab: a simulated OT-2 mixes dyes, and a Bayesian optimiser or Claude (through MCP tools) closes the loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pylabrobot>=0.2.2",
  "baybe>=0.15",
  "numpy",
  "pandas",
  "websockets",
  "mcp>=2.3",
  "matplotlib",  # the comparison chart
]

[project.optional-dependencies]
test = ["pytest"]
video = ["playwright"]  # only for scripts/record_demo.py

[project.scripts]
colour-loop = "colour_loop.cli:main"
colour-loop-mcp = "colour_loop.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colour_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
